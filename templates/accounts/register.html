<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Register | CPM Cashier</title>
  {% load static %}
  {% load crispy_forms_tags %}
  <link rel="shortcut icon" type="image/png" href="{% static 'favicon.ico' %}"/>
  <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
  <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/responsive-custom.css' %}" rel="stylesheet">
</head>

<body class="bg-gradient-primary d-flex align-items-center" style="min-height: 100vh;">

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-11 col-md-9 col-lg-7">
        <div class="card o-hidden border-0 shadow-lg my-3">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <img src="{% static 'img/admin.png' %}" class="rounded-circle mb-3" style="width: 64px; height: 64px;">
              <h1 class="h4 text-gray-900 font-weight-bold">Buat Akun Kasir</h1>
              <p class="text-muted small">Harap mengisi form berikut untuk mendaftar</p>
            </div>

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }} small">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}

            <form method="post">
              {% csrf_token %}
              <div class="form-responsive">
                {{ form|crispy }}
              </div>
              <button type="submit" class="btn btn-primary btn-block font-weight-bold mt-4 py-2">
                Daftar Akun
              </button>
            </form>

            <hr class="my-4">
            <div class="text-center small">
              Sudah memiliki akun? <a href="{% url 'Login' %}" class="font-weight-bold">Login di sini</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
